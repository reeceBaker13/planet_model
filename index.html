<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Procedural Planet</title>

    <script type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            background: transparent;
        }

        model-viewer {
            width: 100%;
            height: 600px;
            background-color: transparent;
        }
    </style>
</head>

<body>

    <model-viewer
        src="GeneratedPlanet.glb"
        camera-controls
        auto-rotate
        auto-rotate-delay="0"
        rotation-per-second="10deg"
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral"
        alt="Interactive 3D procedural planet">
    </model-viewer>

</body>
</html>
